[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eli-lab-av-translator"
version = "0.5.0"
description = "A modular live audiovisual compositor for video collage, generative visuals and Sonic Pi control."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "moderngl>=5.10",
    "av>=12.0",
    "numpy>=1.26",
    "soundcard>=0.4.6",
    "python-osc>=1.10.2,<2",
]

[project.optional-dependencies]
midi = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
]
dev = [
    "ruff>=0.6",
]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "effects*", "generators*", "media*", "rendering*", "ui*"]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyside6.deploy]
title = "eli_lab AV Translator"
input_file = "main.py"
exec_directory = "dist"
icon = "resources/icons/Icon.ico"
mode = "onefile"
extra_args = "--windows-console-mode=attach --include-data-dir=resources=resources --include-data-dir=dictionary=dictionary --include-data-files=THIRD_PARTY_NOTICES.md=THIRD_PARTY_NOTICES.md --include-package=av --include-package=soundcard --include-package=glcontext --include-package=mido --include-package=rtmidi"
